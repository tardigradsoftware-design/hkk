name: Render Negroni Video

on:
  workflow_dispatch:
  push:
    branches:
      - arena/e76d30ec-hkk

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright & Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render 60fps 3-subframe MP4
        run: node render.mjs

      - name: Commit & Push MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add negroni_1080x1080.mp4
          git commit -m "Add rendered negroni_1080x1080.mp4"
          git push origin HEAD:arena/e76d30ec-hkk
